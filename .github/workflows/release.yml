name: Release to npm

# Publish only from version tags using the package's npm trusted publisher.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tarball_sha512: ${{ steps.pack.outputs.sha512 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@11.21.3 --registry=https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - name: Hash the tested package for the independent publish runner
        id: pack
        run: |
          pkg=$(npm pack --silent)
          echo "sha512=$(sha512sum "$pkg" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # required for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      # No registry-url here: setup-node would write a token-based npmrc.
      - run: npm install -g npm@11.21.3 --registry=https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Check the tag and install the exact tarball before publishing it
        shell: bash
        env:
          EXPECTED_SHA512: ${{ needs.build.outputs.tarball_sha512 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          pkg=$(npm pack --silent)
          test "$(sha512sum "$pkg" | cut -d' ' -f1)" = "$EXPECTED_SHA512"
          npm install --prefix "$RUNNER_TEMP/sdk-smoke" --ignore-scripts "$PWD/$pkg"
          test "$("$RUNNER_TEMP/sdk-smoke/node_modules/.bin/trustedrouter" --version)" = "trustedrouter ${GITHUB_REF_NAME#v}"
          echo "RELEASE_TARBALL=$pkg" >> "$GITHUB_ENV"
      - run: npm publish "$RELEASE_TARBALL" --registry=https://registry.npmjs.org --access public --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release page after package publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release page already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "TrustedRouter JavaScript SDK $RELEASE_TAG" \
            --notes "Published on npm: https://www.npmjs.com/package/@lore-hex/trusted-router/v/${RELEASE_TAG#v}"
