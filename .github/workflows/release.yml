name: Release to npm

# Triggered when a `vX.Y.Z` tag is pushed. Publishes with a granular
# automation token (repo secret NPM_TOKEN) for auth; --provenance still
# attests the build via the job's OIDC id-token. If npm Trusted Publishing
# is later configured at https://www.npmjs.com/settings/lore-hex/packages
# (owner Lore-Hex, repo trusted-router-js, workflow release.yml,
# environment npm), the token env line below can be dropped.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm run check
      - run: npm test

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write   # required for npm OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
      # npm >= 11.5 is required for OIDC trusted publishing; node 20 ships npm 10,
      # which silently falls back to setup-node's placeholder token and 404s.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release page after package publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release page already exists: $RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "TrustedRouter JavaScript SDK $RELEASE_TAG" \
            --notes "Published on npm: https://www.npmjs.com/package/@lore-hex/trusted-router/v/${RELEASE_TAG#v}"
